  architecture:
    n_layers: 3
    graph_construction_radius: 6.0
  training:
    epochs: 37
    optimizer: Muon + AdamW
notes:
  description: >
    Mena is a 2.66M-parameter model with a smooth 6.0 A radial cutoff
    (smoothly tapering neighbor interactions between 5.0 A and 6.0 A so that energies
    and forces go continuously to zero as atoms cross the cutoff radius). After many
    iterations and tests, trained on MPtrj for 15.5 hours on a single NVIDIA A100-SXM4-40GB
    (40GB) GPU and evaluated locally on Apple M3 Max (36GB). There are still speed optimizations
    and minor architecture improvements planned, and training was stopped early due to limited
    computational resources. This was done as an independent work, without further human
    assistance. I am open to any inquiries or questions at
    francesco.viola001@studenti.uniparthenope.it.
